# cargo-deny: `cargo deny check` — licenses, security advisories, banned/duplicate crates, sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Known vulnerabilities (RustSec database) and yanked crates fail the check
yanked = "deny"

[licenses]
# Licenses compatible with distributing this repository's tools (BSD-3-Clause)
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are `publish = false` (BSD-3-Clause, see LICENSE): don't check them against the list
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # our own path dependencies inside the workspace

[sources]
unknown-registry = "deny"
unknown-git = "deny"
