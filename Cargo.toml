# Rust tools for the Aret map pipeline. Same conventions as aret-backend: Google Rust style guide,
# pinned toolchain (rust-toolchain.toml), checked in CI by aret-infra's shared Rust workflow.
[workspace]
resolver = "3"
members = ["tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "BSD-3-Clause"
repository = "https://github.com/aret-app/aret-maps"
publish = false

[workspace.dependencies]
# OpenStreetMap PBF reader (parallel, no C dependencies)
osmpbf = "0.3.8"
# geodesic lengths on the WGS 84 ellipsoid (same as PostGIS geography in aret-backend)
geo = { version = "0.33.1", default-features = false }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
codegen-units = 16
